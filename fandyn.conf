# fandyn configuration. After editing:  sudo systemctl reload fandyn
#
# Pick a profile: quiet | balanced | performance
profile = balanced

# Any setting below overrides the profile. Uncomment to tune.
#
# --- temperature curve (degrees C, using the *predicted* temperature)
# t_start    = 45     # fan leaves its minimum speed here
# t_full     = 75     # full speed here
# curve      = 1.5    # >1 keeps the fan quieter at the low end
# t_crit     = 90     # real temperature that forces full speed instantly
#
# --- zero-RPM (fan stops when cool)
# zero_rpm   = 1
# t_on       = 50     # start the fan at this predicted temperature
# t_off      = 44     # stop it below this (after at least 30 s running)
#
# --- prediction
# lookahead  = 20     # seconds of temperature trend to look ahead
# load_gain  = 8      # degrees added at 100% CPU/GPU load
# ram_base   = 0.60   # RAM use (fraction) below this counts as no load
# ram_weight = 0.5    # how much RAM pressure counts as load (0..1)
#
# --- adaptive trim: slowly adds speed while the board stays above t_limit
# t_limit    = 70
# ki         = 1.0
#
# --- noise shaping (PWM is 0..255)
# min_pwm    = 18     # slowest reliable speed for the stock fan
# max_pwm    = 255
# kick_pwm   = 50     # short burst to start the fan from a stop
# kick_ms    = 1500
# slew_up    = 40     # PWM per second when speeding up
# slew_down  = 3      # PWM per second when slowing down (slow = unnoticeable)
# deadband   = 3      # ignore changes smaller than this
#
# --- sensors and timing
# zones       = CPU-therm,GPU-therm
# interval_ms = 1000
